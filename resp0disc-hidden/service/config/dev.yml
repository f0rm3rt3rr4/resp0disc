server:
  host: "127.0.0.1"
  port: 8080
  worker_num: 0
  worker_max_blocking_threads: 0
  keepalive_ms: 0
  backlog: 0
  max_connections: 0
  client_request_timeout_ms: 0
  client_disconnect_timeout_ms: 0
  server_hostname: "localhost"
  shutdown_timeout: 0

tracing:
  max_level: "DEBUG"
  file_name: true
  line_number: true
  thread_id: true
  event_target: false
  log_to_file: true
  pretty: true
  log_dir: "./log"